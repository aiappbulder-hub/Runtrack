<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#00897B">
<title>RunTrack</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --teal:#00897B;--teal2:#00695C;--teal3:#004D40;
  --teal-bg:#E0F2F1;--teal-mid:#B2DFDB;
  --bg:#F0F0EC;--bg2:#fff;--bg3:#F5F5F0;
  --text:#1A1A1A;--muted:#666;--dim:#999;
  --green:#2E7D32;--red:#C62828;--orange:#E65100;
  --nav-h:60px;--r:14px;
  --safe-bot:env(safe-area-inset-bottom,0px);
  --safe-top:env(safe-area-inset-top,0px);
}
html,body{height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text)}
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}

/* NAV */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:rgba(255,255,255,.97);border-top:1px solid #e0e0e0;
  display:flex;z-index:100;
  padding-bottom:var(--safe-bot)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border:none;background:none;cursor:pointer;padding:10px 0;color:var(--dim)}
.nav-btn.on{color:var(--teal)}
.nav-icon{font-size:20px;line-height:1}
.nav-lbl{font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}

/* SCROLL AREA */
.page{padding-top:var(--safe-top);padding-bottom:calc(var(--nav-h) + var(--safe-bot) + 16px)}

/* CALC GRID */
.calc-hdr{padding:16px 16px 8px}
.calc-hdr h1{font-size:22px;font-weight:800;color:var(--teal3)}
.calc-hdr p{font-size:13px;color:var(--muted);margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:8px 12px}
.tile{background:var(--teal);border-radius:var(--r);padding:16px 6px 12px;
  display:flex;flex-direction:column;align-items:center;gap:7px;
  border:none;cursor:pointer;transition:background .15s;aspect-ratio:.9;width:100%}
.tile:active{background:var(--teal2)}
.tile-ic{font-size:26px;line-height:1}
.tile-lbl{font-size:10px;font-weight:700;color:#fff;text-align:center;line-height:1.3;
  text-transform:uppercase;letter-spacing:.2px;white-space:pre-line}

/* SHEET */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;
  display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;
  max-height:92dvh;overflow-y:auto;padding-bottom:calc(20px + var(--safe-bot))}
.sheet-handle{width:36px;height:4px;background:#ddd;border-radius:2px;margin:12px auto 0}
.sheet-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
.sheet-title{font-size:18px;font-weight:800;color:var(--teal3)}
.close-btn{background:var(--bg3);border:none;border-radius:50%;width:32px;height:32px;
  font-size:16px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center}
.sheet-body{padding:4px 16px 8px}

/* FORM ELEMENTS */
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid #e0e0e0;border-radius:10px;
  font-size:15px;font-family:inherit;color:var(--text);background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--teal)}
.btn{width:100%;padding:13px;background:var(--teal);color:#fff;border:none;border-radius:12px;
  font-size:16px;font-weight:700;cursor:pointer;margin:4px 0 16px}
.btn:active{background:var(--teal2)}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:9px;margin:0}

/* RESULTS */
.rc{background:var(--teal-bg);border-radius:12px;padding:14px;margin-bottom:10px}
.rr{display:flex;justify-content:space-between;align-items:center;padding:5px 0;
  border-bottom:1px solid rgba(0,137,123,.12)}
.rr:last-child{border:none}
.rl{font-size:13px;color:var(--teal3);font-weight:500}
.rv{font-size:15px;font-weight:700;color:var(--teal3);font-variant-numeric:tabular-nums}
.rbig{font-size:30px;font-weight:800;color:var(--teal);text-align:center;padding:8px 0 2px;font-variant-numeric:tabular-nums}
.rsub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:8px}
table.rt{width:100%;border-collapse:collapse;font-size:13px}
table.rt th{text-align:left;padding:6px 8px;background:var(--teal);color:#fff;font-weight:600}
table.rt td{padding:6px 8px;border-bottom:1px solid #e8e8e8}
table.rt tr.hi td{background:var(--teal-mid);font-weight:700}

/* PLAN HEADER */
.plan-hdr{background:var(--teal3);color:#fff;padding:16px;
  padding-top:calc(16px + var(--safe-top))}
.plan-hdr h2{font-size:20px;font-weight:800}
.plan-meta{font-size:12px;opacity:.75;margin-top:3px}
.plan-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 12px 0}
.sc{background:#fff;border-radius:12px;padding:11px;text-align:center;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.sv{font-size:20px;font-weight:800;color:var(--teal);font-variant-numeric:tabular-nums}
.sl{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-top:2px}

/* WEEK LIST */
.wlist{padding:12px}
.wcard{background:#fff;border-radius:14px;margin-bottom:8px;overflow:hidden;cursor:pointer;
  box-shadow:0 1px 4px rgba(0,0,0,.08);border:2px solid transparent}
.wcard.cur{border-color:var(--teal);box-shadow:0 2px 12px rgba(0,137,123,.2)}
.wcard:active{opacity:.85}
.whead{display:flex;align-items:center;gap:10px;padding:10px 12px}
.wnum{font-size:11px;font-weight:700;color:var(--muted);min-width:28px}
.winfo{flex:1;min-width:0}
.wdates{font-size:13px;font-weight:600}
.wsess{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wkm{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.wplan{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.wact{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.wbar{height:4px;background:var(--bg3);overflow:hidden}
.wbar-fill{height:100%;transition:width .3s}
.now-badge{background:var(--teal);color:#fff;font-size:9px;font-weight:800;
  padding:1px 5px;border-radius:4px;text-transform:uppercase;margin-left:5px;vertical-align:middle}
.phase-chip{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;
  border-radius:10px;text-transform:uppercase;letter-spacing:.3px}
.ph-REBUILD{background:#E3F2FD;color:#1565C0}
.ph-BASE{background:#F3E5F5;color:#6A1B9A}
.ph-BUILD{background:#FFF8E1;color:#F57F17}
.ph-PEAK{background:#FCE4EC;color:#B71C1C}
.ph-TAPER{background:#E8F5E9;color:#1B5E20}
.ph-RACE{background:var(--teal-bg);color:var(--teal3)}

/* WEEK DETAIL */
.wdet-hdr{background:var(--teal3);color:#fff;padding:14px 16px;padding-top:calc(14px + var(--safe-top))}
.wdet-hdr h3{font-size:18px;font-weight:800}
.wdet-meta{font-size:12px;opacity:.75;margin-top:2px}
.wdet-sess{background:rgba(255,255,255,.15);border-radius:8px;padding:9px;margin-top:8px;
  font-size:12px;line-height:1.4}
.back-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 12px;
  border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px;display:inline-flex;align-items:center;gap:4px}
.day-cards{padding:10px 12px}
.dcard{background:#fff;border-radius:12px;margin-bottom:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;cursor:pointer}
.dname{font-size:14px;font-weight:700}
.dtype{font-size:11px;color:var(--muted);margin-top:1px}
.dplan-km{font-size:14px;font-weight:700;color:var(--teal);font-variant-numeric:tabular-nums}
.dform{padding:4px 12px 12px;border-top:1px solid #f0f0f0}
.status-row{display:flex;gap:6px;margin:10px 0}
.sbtn{flex:1;padding:8px;border:1.5px solid #e0e0e0;border-radius:8px;background:#fff;
  font-size:12px;font-weight:600;cursor:pointer;text-align:center}
.sbtn.done{border-color:var(--green);background:#E8F5E9;color:var(--green)}
.sbtn.skip{border-color:var(--red);background:#FFEBEE;color:var(--red)}
.sbtn.mod{border-color:var(--orange);background:#FFF3E0;color:var(--orange)}
.rpe-lbl{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--teal);margin-top:4px}
textarea{resize:none;line-height:1.4}
.save-btn{width:100%;padding:10px;background:var(--teal);color:#fff;border:none;border-radius:10px;
  font-size:14px;font-weight:700;cursor:pointer;margin-top:10px}
.save-btn:active{background:var(--teal2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.dot-done{background:var(--green)}
.dot-skip{background:var(--red)}
.dot-mod{background:var(--orange)}
.warn{background:#FFF3E0;border-left:4px solid var(--orange);padding:10px 12px;
  margin:0 12px 10px;border-radius:0 8px 8px 0;font-size:12px;color:var(--orange);font-weight:600;line-height:1.4}
.clink{display:inline-flex;align-items:center;gap:4px;padding:7px 11px;
  background:var(--teal-bg);color:var(--teal3);border:none;border-radius:8px;
  font-size:12px;font-weight:700;cursor:pointer;margin:6px 6px 0 0}
.coach-note{background:var(--teal-bg);border-radius:10px;padding:10px;margin:0 12px 10px;
  font-size:13px;color:var(--teal3);line-height:1.4}
.coach-note strong{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.wk-total{display:flex;justify-content:space-between;align-items:center;padding:0 12px 8px;font-size:13px}
</style>
</head>

// ─── MATH HELPERS ────────────────────────────────────────────────────────────
function parsePace(s) {
  var p = (s||'').trim().split(':');
  if (p.length < 2) return NaN;
  var m = parseFloat(p[0]), sec = parseFloat(p[1]);
  if (isNaN(m) || isNaN(sec)) return NaN;
  return m + sec/60;
}
function fmtPace(dec) {
  if (!isFinite(dec) || dec <= 0) return '--';
  var m = Math.floor(dec), s = Math.round((dec-m)*60);
  if (s===60) { m++; s=0; }
  return m+':'+(s<10?'0':'')+s;
}
function parseTime(s) {
  var p = (s||'').trim().split(':').map(Number);
  if (p.some(isNaN)) return NaN;
  if (p.length===3) return p[0]*3600+p[1]*60+p[2];
  if (p.length===2) return p[0]*60+p[1];
  return NaN;
}
function hms(hId, mId, sId) {
  var h=parseInt(document.getElementById(hId).value)||0;
  var m=parseInt(document.getElementById(mId).value)||0;
  var s=parseInt(document.getElementById(sId).value)||0;
  return h*3600+m*60+s;
}
function fmtTime(sec) {
  if (!isFinite(sec)||sec<0) return '--';
  var h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=Math.round(sec%60);
  if (s===60){m++;s=0;} if(m===60){h++;m=0;}
  return (h>0?h+':':'')+(m<10&&h>0?'0':'')+m+':'+(s<10?'0':'')+s;
}
function riegel(t1,d1,d2) { return t1*Math.pow(d2/d1,1.06); }
function calcVDOT(km,secs) {
  var v=km*1000/secs*60, t=secs/60;
  var pct=0.8+0.1894393*Math.exp(-0.012778*t)+0.2989558*Math.exp(-0.1932605*t);
  return Math.round((-4.6+0.182258*v+0.000104*v*v)/pct*10)/10;
}
function vdotPaces(vdot) {
  var vVO2=(vdot+4.6)/0.182258;
  return {
    easy:fmtPace(1000/(vVO2*0.67)/60),
    mp:fmtPace(1000/(vVO2*0.80)/60),
    thresh:fmtPace(1000/(vVO2*0.875)/60),
    intv:fmtPace(1000/(vVO2*0.975)/60),
    rep:fmtPace(1000/(vVO2*1.05)/60)
  };
}

window.calcTool = function(id) {
  var el = document.getElementById('tool-result');
  if (!el) return;
  var h = '';
  function v(id) { var e=document.getElementById(id); return e?e.value:''; }
  function n(id) { return parseFloat(v(id)); }

  switch(id) {
    case 'splits': {
      var d=n('s-dist'), t=hms('s-th','s-tm','s-ts'), sd=parseFloat(v('s-split'));
      if (isNaN(d)||isNaN(t)||d<=0||t<=0) { el.innerHTML='<p style="color:var(--red)">Enter valid distance and time.</p>'; return; }
      var ppk=t/d, rows='', cum=0;
      for (var i=sd; i<=d+0.001; i+=sd) {
        var seg=Math.min(sd,d-(i-sd)); cum+=seg*ppk;
        var km=Math.min(i,d).toFixed(1);
        var hi=parseFloat(km)===42.2||parseFloat(km)===d?' class="hi"':'';
        rows+='<tr'+hi+'><td>'+km+' km</td><td>'+fmtTime(seg*ppk)+'</td><td>'+fmtTime(cum)+'</td></tr>';
      }
      h='<div class="rbig">'+fmtPace(ppk/60)+'/km</div><div class="rsub">Even split pace</div>'
        +'<table class="rt"><thead><tr><th>Split</th><th>Time</th><th>Cumulative</th></tr></thead><tbody>'+rows+'</tbody></table>';
      break;
    }
    case 'race': {
      var d=parseFloat(v('r-dist')), t=hms('r-th','r-tm','r-ts');
      var raceAge=n('r-age');
      if (!d||!t||d<=0) { el.innerHTML='<p style="color:var(--red)">Enter valid distance and time.</p>'; return; }
      var ageFactor=raceAge<35?1:1+(raceAge-35)*0.003;
      var dists=[{l:'400 m',km:0.4},{l:'800 m',km:0.8},{l:'1 km',km:1},{l:'1.5 km',km:1.5},{l:'3.175 km (Cooper)',km:3.175},{l:'5 km',km:5},{l:'10 km',km:10},{l:'14.639 km (1 Hour)',km:14.639},{l:'15 km',km:15},{l:'21.1 km',km:21.1},{l:'42.2 km',km:42.2},{l:'100 km',km:100}];
      var rows=dists.map(function(rd){
        var sec=riegel(t,d,rd.km)*ageFactor;
        var hi=Math.abs(rd.km-d)<0.01?' class="hi"':'';
        return '<tr'+hi+'><td>'+rd.l+'</td><td>'+fmtTime(sec)+'</td><td>'+fmtPace(sec/rd.km/60)+'/km</td></tr>';
      }).join('');
      h='<table class="rt"><thead><tr><th>Race</th><th>Predicted</th><th>Pace/km</th></tr></thead><tbody>'+rows+'</tbody></table>';
      break;
    }
    case 'pb': {
      if (!window.PB_ENTRIES) {
        var pbSaved2=localStorage.getItem('rt-pb');
        window.PB_ENTRIES=pbSaved2?JSON.parse(pbSaved2):[{km:5,l:'5 km',t:0},{km:10,l:'10 km',t:0},{km:21.1,l:'21.1 km',t:0},{km:42.2,l:'42.2 km',t:0}];
      }
      var pbInputs=document.querySelectorAll('.pb-t-inp');
      pbInputs.forEach(function(inp){
        var idx=parseInt(inp.dataset.idx);
        var pt=parseTime(inp.value);
        if (!isNaN(pt)&&pt>0) window.PB_ENTRIES[idx].t=pt; else window.PB_ENTRIES[idx].t=0;
      });
      localStorage.setItem('rt-pb',JSON.stringify(window.PB_ENTRIES));
      var pbHasTime=window.PB_ENTRIES.filter(function(e){return e.t>0;});
      if (!pbHasTime.length) { el.innerHTML='<p style="color:var(--red)">Enter at least one PB time (e.g. 19:07 or 1:32:00).</p>'; return; }
      var pbBase=pbHasTime.reduce(function(a,b){return (a.t/a.km)<(b.t/b.km)?a:b;});
      var rows2=window.PB_ENTRIES.map(function(e){
        var pred=riegel(pbBase.t,pbBase.km,e.km);
        var pctTxt=''; var potStyle='';
        if (e.t>0) { var pct=Math.round((e.t-pred)/e.t*1000)/10; pctTxt=' ('+pct.toFixed(1)+'%)'; potStyle=pct>2?'color:var(--green)':pct<0.5?'color:#999':''; }
        return '<tr><td>'+e.l+'</td><td>'+(e.t>0?fmtTime(e.t):'—')+'</td><td style="'+potStyle+'">'+fmtTime(pred)+pctTxt+'</td></tr>';
      }).join('');
      h='<table class="rt"><thead><tr><th>Distance</th><th>Your PB</th><th>Potential</th></tr></thead><tbody>'+rows2+'</tbody></table>';
      break;
    }
    case 'vo2': {
      var d=n('v-dist'), t=parseTime(v('v-time'));
      if (isNaN(d)||isNaN(t)||d<=0||t<=0) { el.innerHTML='<p style="color:var(--red)">Enter valid values.</p>'; return; }
      var vdot=calcVDOT(d,t), p=vdotPaces(vdot);
      h='<div class="rbig">'+vdot+'</div><div class="rsub">Estimated VDOT</div>'
        +'<div class="rc"><div class="rr"><span class="rl">Easy pace</span><span class="rv">'+p.easy+'/km</span></div>'
        +'<div class="rr"><span class="rl">Marathon pace</span><span class="rv">'+p.mp+'/km</span></div>'
        +'<div class="rr"><span class="rl">Threshold pace</span><span class="rv">'+p.thresh+'/km</span></div>'
        +'<div class="rr"><span class="rl">Interval pace</span><span class="rv">'+p.intv+'/km</span></div></div>';
      break;
    }
    case 'paces': {
      var tpDist=parseFloat(v('tp-dist')), tpTime=hms('tp-th','tp-tm','tp-ts');
      var hrMin=n('tp-hrmin'), hrMax=n('tp-hrmax');
      if (!tpDist||!tpTime) { el.innerHTML='<p style="color:var(--red)">Enter distance and time.</p>'; return; }
      var ppkSec=tpTime/tpDist, paceMinKm=ppkSec/60;
      var hrReserve=hrMax-hrMin;
      var zones=[
        {name:'Recovery',    pLo:1.36,pHi:1.50,hrLo:0.60,hrHi:0.70},
        {name:'Long Run',    pLo:1.18,pHi:1.33,hrLo:0.65,hrHi:0.75},
        {name:'Easy',        pLo:1.15,pHi:1.31,hrLo:0.65,hrHi:0.75},
        {name:'Steady State',pLo:1.08,pHi:1.13,hrLo:0.75,hrHi:0.85},
        {name:'Tempo',       pLo:1.04,pHi:1.08,hrLo:0.80,hrHi:0.88},
        {name:'Tempo Intv.', pLo:1.03,pHi:1.07,hrLo:0.83,hrHi:0.90},
        {name:'Interval',    pLo:1.00,pHi:1.04,hrLo:0.87,hrHi:0.95}
      ];
      var paceRows=zones.map(function(z){
        var pLo=fmtPace(paceMinKm*z.pLo), pHi=fmtPace(paceMinKm*z.pHi);
        var hrLo=Math.round(hrMin+z.hrLo*hrReserve), hrHi=Math.round(hrMin+z.hrHi*hrReserve);
        return '<tr><td>'+z.name+'</td><td>'+pLo+' – '+pHi+'</td><td>'+hrLo+' – '+hrHi+'</td></tr>';
      }).join('');
      h='<div class="rbig">'+fmtPace(paceMinKm)+'</div><div class="rsub">Race pace /km</div>'
        +'<table class="rt"><thead><tr><th>Zone</th><th>Pace /km</th><th>HR (bpm)</th></tr></thead><tbody>'+paceRows+'</tbody></table>';
      break;
    }
    case 'age': {
      var age=n('ag-age'), dist=n('ag-dist'), t=parseTime(v('ag-time'));
      if (isNaN(age)||isNaN(dist)||isNaN(t)||t<=0) { el.innerHTML='<p style="color:var(--red)">Enter valid values.</p>'; return; }
      var wr=AG_RECORDS[dist]||125;
      var ageKey=Math.floor(age/5)*5; ageKey=Math.max(20,Math.min(70,ageKey));
      var af=AG_FACTORS_M[ageKey]||0.95;
      var graded=(wr*60)/af; // world record time adjusted for age
      var pct=Math.min(100,Math.round(graded/t*100*10)/10);
      var cat=pct>=90?'World class':pct>=80?'National class':pct>=70?'Regional class':pct>=60?'Local class':'Recreational';
      h='<div class="rbig">'+pct+'%</div><div class="rsub">Age Grade — '+cat+'</div>'
        +'<div class="rc"><div class="rr"><span class="rl">Age factor</span><span class="rv">'+(af*100).toFixed(0)+'%</span></div>'
        +'<div class="rr"><span class="rl">Open equivalent</span><span class="rv">'+fmtTime(graded)+'</span></div></div>';
      break;
    }
    case 'hills': {
      var d=n('h-dist'), fp=parsePace(v('h-pace')), elev=n('h-elev');
      if (isNaN(d)||isNaN(fp)||isNaN(elev)||d<=0||fp<=0) { el.innerHTML='<p style="color:var(--red)">Enter valid values.</p>'; return; }
      // ~1 min per 100m gain per 10km (Naismith/minetti simplified)
      var timePenaltyMin=(elev/100)*(d/10);
      var flatTimeSec=fp*60*d;
      var hillTimeSec=flatTimeSec+timePenaltyMin*60;
      var effPace=hillTimeSec/d/60;
      h='<div class="rc"><div class="rr"><span class="rl">Flat time</span><span class="rv">'+fmtTime(flatTimeSec)+'</span></div>'
        +'<div class="rr"><span class="rl">Hill-adjusted time</span><span class="rv">'+fmtTime(hillTimeSec)+'</span></div>'
        +'<div class="rr"><span class="rl">Time added</span><span class="rv">'+Math.round(timePenaltyMin)+' min</span></div>'
        +'<div class="rr"><span class="rl">Effective flat pace</span><span class="rv">'+fmtPace(effPace)+'/km</span></div></div>';
      break;
    }
    case 'weight': {
      var cur=n('w-cur'), goal=n('w-goal'), mp=parsePace(v('w-pace'));
      if (isNaN(cur)||isNaN(goal)||isNaN(mp)) { el.innerHTML='<p style="color:var(--red)">Enter valid values.</p>'; return; }
      var diff=cur-goal;
      // ~4 sec/km per kg lost (running economy improvement)
      var improvSecKm=diff*4, newPace=mp-improvSecKm/60;
      var marathonSaved=Math.round(improvSecKm*42.195);
      h='<div class="rc"><div class="rr"><span class="rl">Weight change</span><span class="rv">'+(diff>=0?'-'+diff.toFixed(1):'+'+Math.abs(diff).toFixed(1))+' kg</span></div>'
        +'<div class="rr"><span class="rl">Pace improvement</span><span class="rv">'+Math.round(improvSecKm)+' sec/km</span></div>'
        +'<div class="rr"><span class="rl">New marathon pace</span><span class="rv">'+fmtPace(newPace)+'/km</span></div>'
        +'<div class="rr"><span class="rl">Marathon time saved</span><span class="rv">'+fmtTime(Math.abs(marathonSaved))+'</span></div></div>';
      break;
    }
    case 'cal': {
      var w=n('cl-kg'), d=n('cl-km');
      if (isNaN(w)||isNaN(d)) { el.innerHTML='<p style="color:var(--red)">Enter valid values.</p>'; return; }
      var kcal=Math.round(w*d), carbs=Math.round(kcal*0.55/4), fat=Math.round(kcal*0.35/9), gels=Math.ceil(kcal/100);
      h='<div class="rbig">'+kcal+'</div><div class="rsub">kcal burned</div>'
        +'<div class="rc"><div class="rr"><span class="rl">Carbohydrate</span><span class="rv">'+carbs+' g</span></div>'
        +'<div class="rr"><span class="rl">Fat</span><span class="rv">'+fat+' g</span></div>'
        +'<div class="rr"><span class="rl">Gels needed (~100kcal)</span><span class="rv">'+gels+'</span></div></div>';
      break;
    }
    case 'bmi': {
      var w=n('bmi-kg'), h2=n('bmi-cm')/100;
      if (isNaN(w)||isNaN(h2)||h2<=0) { el.innerHTML='<p style="color:var(--red)">Enter valid values.</p>'; return; }
      var bmi=w/(h2*h2);
      var cat=bmi<18.5?'Underweight':bmi<25?'Normal weight':bmi<30?'Overweight':'Obese';
      var col=bmi<18.5?'var(--orange)':bmi<25?'var(--green)':bmi<30?'var(--orange)':'var(--red)';
      var lo=Math.round(20*h2*h2), hi=Math.round(22*h2*h2);
      h='<div class="rbig" style="color:'+col+'">'+bmi.toFixed(1)+'</div><div class="rsub">'+cat+'</div>'
        +'<div class="rc"><div class="rr"><span class="rl">Ideal runner weight</span><span class="rv">'+lo+'–'+hi+' kg (BMI 20–22)</span></div></div>';
      break;
    }
  }
  el.innerHTML = h;
};

window.calcPaceFrom = function(from) {
  var el = document.getElementById('pace-result');
  if (!el) return;
  function gv(xid) { var e=document.getElementById(xid); return e?e.value:''; }
  function gn(xid) { return parseFloat(gv(xid))||0; }
  function sv(xid,val) { var e=document.getElementById(xid); if(e) e.value=val; }
  var pm=gn('p-pm'), ps=gn('p-ps');
  var paceMin=pm+ps/60;
  var dist=gn('p-dist');
  var th=gn('p-th'), tm=gn('p-tm'), ts=gn('p-ts');
  var timeSec=th*3600+tm*60+ts;
  if (from==='spd') {
    var spd=gn('p-spd');
    if (!spd) { el.innerHTML='<p style="color:var(--red)">Enter a speed.</p>'; return; }
    paceMin=60/spd;
    var pm2=Math.floor(paceMin), ps2=Math.round((paceMin-pm2)*60);
    if (ps2===60){pm2++;ps2=0;} sv('p-pm',pm2); sv('p-ps',ps2<10?'0'+ps2:String(ps2));
  } else if (from==='pace') {
    if (!paceMin||paceMin<=0) { el.innerHTML='<p style="color:var(--red)">Enter a pace.</p>'; return; }
  } else if (from==='dist') {
    if (!dist||!paceMin) { el.innerHTML='<p style="color:var(--red)">Enter distance and pace first.</p>'; return; }
    timeSec=dist*paceMin*60;
    var fth=Math.floor(timeSec/3600), ftm=Math.floor((timeSec%3600)/60), fts=Math.round(timeSec%60);
    if (fts===60){ftm++;fts=0;} if(ftm===60){fth++;ftm=0;}
    sv('p-th',fth); sv('p-tm',ftm<10?'0'+ftm:String(ftm)); sv('p-ts',fts<10?'0'+fts:String(fts));
  } else if (from==='time') {
    if (!timeSec||!dist) { el.innerHTML='<p style="color:var(--red)">Enter time and distance first.</p>'; return; }
    paceMin=timeSec/dist/60;
    var pm3=Math.floor(paceMin), ps3=Math.round((paceMin-pm3)*60);
    if (ps3===60){pm3++;ps3=0;} sv('p-pm',pm3); sv('p-ps',ps3<10?'0'+ps3:String(ps3));
  }
  if (!paceMin||paceMin<=0) { el.innerHTML='<p style="color:var(--red)">Cannot compute.</p>'; return; }
  var spKmh=60/paceMin, spMph=spKmh/1.60934, paceMile=paceMin*1.60934;
  el.innerHTML='<div class="rc">'
    +'<div class="rr"><span class="rl">Pace /km</span><span class="rv">'+fmtPace(paceMin)+' min/km</span></div>'
    +'<div class="rr"><span class="rl">Pace /mile</span><span class="rv">'+fmtPace(paceMile)+' min/mi</span></div>'
    +'<div class="rr"><span class="rl">Speed</span><span class="rv">'+spKmh.toFixed(2)+' km/h</span></div>'
    +'<div class="rr"><span class="rl">Speed</span><span class="rv">'+spMph.toFixed(2)+' mph</span></div></div>';
};

window.calcCad = function(from) {
  var el = document.getElementById('cad-result');
  if (!el) return;
  function gv2(xid) { var e=document.getElementById(xid); return e?e.value:''; }
  function gn2(xid) { return parseFloat(gv2(xid))||0; }
  function sv2(xid,val) { var e=document.getElementById(xid); if(e) e.value=val; }
  var pm=gn2('cd-pm'), ps=gn2('cd-ps');
  var paceMin=pm+ps/60; if (!paceMin||paceMin<=0) paceMin=5;
  var sl=gn2('cd-sl');
  var cad=gn2('cd-cad');
  var speedMpm=1000/paceMin;
  if (from==='pace') {
    if (!cad) cad=180;
    sl=(speedMpm/cad)*100; sv2('cd-sl',sl.toFixed(1));
  } else if (from==='stride') {
    if (!sl) { el.innerHTML='<p style="color:var(--red)">Enter stride length.</p>'; return; }
    cad=speedMpm/(sl/100); sv2('cd-cad',Math.round(cad));
  } else if (from==='cad') {
    if (!cad) { el.innerHTML='<p style="color:var(--red)">Enter cadence.</p>'; return; }
    sl=(speedMpm/cad)*100; sv2('cd-sl',sl.toFixed(1));
  }
  var tip=cad<170?'Increase cadence — shorter, quicker steps reduce injury risk':cad>185?'High cadence — focus on relaxed turnover':'Cadence is in the optimal 170-185 spm range';
  el.innerHTML='<div class="rc">'
    +'<div class="rr"><span class="rl">Stride length</span><span class="rv">'+(sl/100).toFixed(2)+' m</span></div>'
    +'<div class="rr"><span class="rl">Cadence</span><span class="rv">'+Math.round(cad)+' spm</span></div>'
    +'<div class="rr"><span class="rl">Speed</span><span class="rv">'+( 60/paceMin).toFixed(2)+' km/h</span></div></div>'
    +'<div style="background:var(--teal-bg);border-radius:8px;padding:10px;font-size:13px;color:var(--teal3);margin-top:8px">'+tip+'</div>';
};

// ─── RENDER FUNCTIONS ────────────────────────────────────────────────────────
function renderCalcTab() {
  var tool = TOOL ? TOOLS.find(function(t){return t.id===TOOL;}) : null;
  var tiles = TOOLS.map(function(t){
    return '<button class="tile" data-tool="'+t.id+'">'
      +'<span class="tile-ic">'+t.ic+'</span>'
      +'<span class="tile-lbl">'+t.lbl+'</span></button>';
  }).join('');
  var sheet = tool ? '<div class="overlay" id="sheet-overlay">'
    +'<div class="sheet"><div class="sheet-handle"></div>'
    +'<div class="sheet-hdr"><span class="sheet-title">'+tool.ic+' '+tool.lbl.replace('\n',' ')+'</span>'
    +'<button class="close-btn" id="sheet-close">✕</button></div>'
    +'<div class="sheet-body">'+toolForm(TOOL)+'</div></div></div>' : '';
  return '<div class="page">'
    +'<div class="calc-hdr"><h1>Running Calculator</h1><p>Melbourne 2026 · Target 2:55 · 4:09/km</p></div>'
    +'<div class="grid">'+tiles+'</div></div>'
    +sheet;
}

function wkActual(w) {
  if (w.actualTotal) return w.actualTotal;
  return DAYS.reduce(function(s,d){
    var k=w.wk+'-'+d, l=LOGS[k];
    return s+(l?(l.am+l.pm):0);
  },0);
}

function renderPlanList() {
  var totalActual=PLAN.reduce(function(s,w){return s+wkActual(w);},0);
  var wksLeft=24-CW+1;
  var stats='<div class="plan-stats">'
    +'<div class="sc"><div class="sv">'+CW+'</div><div class="sl">Current Week</div></div>'
    +'<div class="sc"><div class="sv">'+Math.round(totalActual)+'</div><div class="sl">km Logged</div></div>'
    +'<div class="sc"><div class="sv">'+wksLeft+'</div><div class="sl">Weeks Left</div></div>'
    +'</div>';

  var cards = PLAN.map(function(w){
    var act=wkActual(w), pct=act>0?Math.min(130,Math.round(act/w.total*100)):0;
    var barCol=pct>115?'var(--orange)':pct>=90?'var(--green)':'var(--teal)';
    var isCur=w.wk===CW;
    var badge=isCur?'<span class="now-badge">NOW</span>':'';
    var actSpan=act>0?'<span class="wact" style="color:'+(pct>115?'var(--orange)':pct>=90?'var(--green)':'var(--muted)')+'">'+act.toFixed(0)+'km actual</span>':'';
    var bar=act>0?'<div class="wbar"><div class="wbar-fill" style="width:'+pct+'%;background:'+barCol+'"></div></div>':'';
    return '<div class="wcard'+(isCur?' cur':'')+'" data-wk="'+w.wk+'">'
      +'<div class="whead"><div class="wnum">W'+w.wk+'</div>'
      +'<div class="winfo"><div class="wdates">'+w.dates+badge+'</div><div class="wsess">'+w.session+'</div></div>'
      +'<div class="wkm"><span class="phase-chip ph-'+w.phase+'">'+w.phase+'</span>'
      +'<span class="wplan">'+w.total+'km</span>'+actSpan+'</div></div>'+bar+'</div>';
  }).join('');

  return '<div class="plan-hdr">'
    +'<h2>Melbourne Marathon 2026</h2>'
    +'<p class="plan-meta">Race Day: 11 Oct 2026 · Target: Sub-2:55 (4:09/km)</p>'
    +'<p class="plan-meta" style="margin-top:4px;font-size:11px;opacity:.6">Starting parkrun: 19:59 · 24 weeks</p>'
    +'</div>'+stats+'<div class="wlist">'+cards+'</div>';
}

function renderDayCard(w, day) {
  var key = w.wk+'-'+day;
  var log = LOGS[key]||{};
  var ds = DAY_STATUS[key]||{status:log.status||'',am:log.am||'',pm:log.pm||'',rpe:log.rpe||5,note:log.note||''};
  var isOpen = OPEN_DAYS[key];
  var planKm = (w.plan&&w.plan[day])||0;
  var actKm = (parseFloat(ds.am)||0)+(parseFloat(ds.pm)||0);
  var dot = log.status?'<span class="dot dot-'+log.status+'"></span>':'';
  var loggedKm = log.status&&(log.am+log.pm)>0?'<span style="font-size:13px;font-weight:700;font-variant-numeric:tabular-nums">'+(log.am+log.pm).toFixed(1)+'</span> ':'' ;

  // Calculator link
  var clink='';
  if (day==='sun') clink='<button class="clink" onclick="openCalcLink(\'splits\')">📊 Splits</button>';
  if (day==='tue') clink='<button class="clink" onclick="openCalcLink(\'paces\')">⏱ Training Paces</button>';
  if (day==='sat') clink='<button class="clink" onclick="openCalcLink(\'race\')">🏃 Race Predictor</button>';
  if (day==='fri') clink='<button class="clink" onclick="openCalcLink(\'hills\')">⛰️ Hills Impact</button>';

  var form = isOpen ? '<div class="dform">'
    +'<div class="status-row">'
    +'<button class="sbtn'+(ds.status==='done'?' done':'')+'" onclick="setStatus(\''+key+'\',\'done\')">✓ Done</button>'
    +'<button class="sbtn'+(ds.status==='skip'?' skip':'')+'" onclick="setStatus(\''+key+'\',\'skip\')">✗ Skipped</button>'
    +'<button class="sbtn'+(ds.status==='mod'?' mod':'')+'" onclick="setStatus(\''+key+'\',\'mod\')">~ Modified</button>'
    +'</div>'
    +'<div class="fr2"><div class="fg"><label>AM (km)</label><input type="number" step="0.1" value="'+ds.am+'" placeholder="0" oninput="setField(\''+key+'\',\'am\',this.value)"></div>'
    +'<div class="fg"><label>PM (km)</label><input type="number" step="0.1" value="'+ds.pm+'" placeholder="0" oninput="setField(\''+key+'\',\'pm\',this.value)"></div></div>'
    +'<div><div class="rpe-lbl"><span>RPE: '+ds.rpe+'/10</span><span style="color:'+(ds.rpe>7?'var(--red)':ds.rpe<4?'var(--green)':'var(--muted)')+'">'+( ds.rpe>7?'Hard 🔴':ds.rpe<4?'Easy 🟢':'Moderate 🟡')+'</span></div>'
    +'<input type="range" min="1" max="10" value="'+ds.rpe+'" oninput="setRPE(\''+key+'\',this.value,this)"></div>'
    +'<textarea rows="2" style="margin-top:10px;width:100%;padding:9px 10px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:14px;font-family:inherit;resize:none;outline:none" placeholder="How did it go?" oninput="setField(\''+key+'\',\'note\',this.value)">'+ds.note+'</textarea>'
    +clink
    +'<button class="save-btn" onclick="saveDay(\''+key+'\')">Save</button>'
    +'</div>' : '';

  return '<div class="dcard" id="dc-'+key+'">'
    +'<div class="dhead" onclick="toggleDay(\''+key+'\')">'
    +'<div><div class="dname">'+DAY_NAMES[day]+'</div><div class="dtype">'+DAY_TYPES[day]+'</div></div>'
    +'<div style="display:flex;align-items:center;gap:6px">'
    +dot+loggedKm
    +'<span class="dplan-km">'+planKm+'km</span>'
    +'<span style="color:var(--muted);font-size:16px">'+(isOpen?'▲':'▼')+'</span>'
    +'</div></div>'+form+'</div>';
}

function renderWeekDetail(wkNum) {
  var w = PLAN[wkNum-1];
  var totalAct = DAYS.reduce(function(s,d){var k=wkNum+'-'+d,l=LOGS[k];return s+(l?(l.am+l.pm):0);},0);
  var prevOver = PLAN.slice(0,wkNum-1).filter(function(pw){return pw.actualTotal&&pw.actualTotal>pw.total*1.15;}).length;
  var warn = prevOver>=2&&wkNum>=3?'<div class="warn">⚠️ You\'ve run 15%+ over plan 2+ weeks in a row. This is how overtraining injuries start. Trust the plan volume.</div>':'';
  var comment = w.comment?'<div class="coach-note"><strong>Coach Note</strong>'+w.comment+'</div>':'';
  var total = totalAct>0?'<div class="wk-total"><span style="color:var(--muted)">Logged this week</span>'
    +'<span style="font-weight:700;color:'+(totalAct>w.total*1.15?'var(--orange)':totalAct>w.total*0.9?'var(--green)':'var(--text)')+';font-variant-numeric:tabular-nums">'+totalAct.toFixed(1)+' / '+w.total+' km</span></div>':'';
  var days = DAYS.map(function(d){return renderDayCard(w,d);}).join('');

  return '<div class="wdet-hdr">'
    +'<button class="back-btn" id="plan-back">← Back</button>'
    +'<h3>Week '+wkNum+' — '+w.phase+'</h3>'
    +'<div class="wdet-meta">'+w.dates+' · Plan: '+w.total+'km</div>'
    +'<div class="wdet-sess">'+w.session+'</div></div>'
    +warn+comment+total
    +'<div class="day-cards">'+days+'</div>';
}

function renderNav() {
  return '<nav class="nav">'
    +'<button class="nav-btn'+(TAB==='calc'?' on':'')+'" id="nav-calc">'
    +'<span class="nav-icon">🧮</span><span class="nav-lbl">Calculator</span></button>'
    +'<button class="nav-btn'+(TAB==='plan'?' on':'')+'" id="nav-plan">'
    +'<span class="nav-icon">📋</span><span class="nav-lbl">My Plan</span></button>'
    +'</nav>';
}

function render() {
  var content='';
  if (TAB==='calc') {
    content=renderCalcTab();
  } else {
    content='<div class="page">'+(PLAN_WK?renderWeekDetail(PLAN_WK):renderPlanList())+'</div>';
  }
  document.getElementById('app').innerHTML=content+renderNav();
  attachListeners();
}

// ─── EVENT HANDLERS ──────────────────────────────────────────────────────────
function attachListeners() {
  var navCalc=document.getElementById('nav-calc');
  var navPlan=document.getElementById('nav-plan');
  if (navCalc) navCalc.onclick=function(){TAB='calc';TOOL=null;render();};
  if (navPlan) navPlan.onclick=function(){TAB='plan';render();};

  // Calc tile clicks
  document.querySelectorAll('.tile').forEach(function(t){
    t.onclick=function(){TOOL=this.dataset.tool;render();};
  });

  // Sheet close / overlay click
  var sheetClose=document.getElementById('sheet-close');
  if (sheetClose) sheetClose.onclick=function(){TOOL=null;render();};
  var overlay=document.getElementById('sheet-overlay');
  if (overlay) overlay.onclick=function(e){if(e.target===overlay){TOOL=null;render();}};

  // Plan week click
  document.querySelectorAll('.wcard').forEach(function(c){
    c.onclick=function(){PLAN_WK=parseInt(this.dataset.wk);render();};
  });

  // Plan back
  var back=document.getElementById('plan-back');
  if (back) back.onclick=function(){PLAN_WK=null;render();};
}

// Day card interactions (called from inline handlers)
window.toggleDay=function(key){
  OPEN_DAYS[key]=!OPEN_DAYS[key];
  var w=PLAN[parseInt(key.split('-')[0])-1];
  var day=key.split('-')[1];
  var el=document.getElementById('dc-'+key);
  if (el) el.outerHTML=renderDayCard(w,day);
};

window.setStatus=function(key,status){
  if (!DAY_STATUS[key]) DAY_STATUS[key]={status:'',am:'',pm:'',rpe:5,note:''};
  DAY_STATUS[key].status=status;
  var log=LOGS[key]||{};
  Object.assign(DAY_STATUS[key],{am:DAY_STATUS[key].am||log.am||'',pm:DAY_STATUS[key].pm||log.pm||'',rpe:DAY_STATUS[key].rpe||log.rpe||5,note:DAY_STATUS[key].note||log.note||''});
  var w=PLAN[parseInt(key.split('-')[0])-1];
  var day=key.split('-')[1];
  var el=document.getElementById('dc-'+key);
  OPEN_DAYS[key]=true;
  if (el) el.outerHTML=renderDayCard(w,day);
};

window.setField=function(key,field,val){
  if (!DAY_STATUS[key]) DAY_STATUS[key]={status:'',am:'',pm:'',rpe:5,note:''};
  DAY_STATUS[key][field]=val;
};

window.setRPE=function(key,val,el){
  if (!DAY_STATUS[key]) DAY_STATUS[key]={status:'',am:'',pm:'',rpe:5,note:''};
  DAY_STATUS[key].rpe=parseInt(val);
  // Update label without full re-render
  var lbl=el.previousElementSibling;
  if (lbl) {
    var col=val>7?'var(--red)':val<4?'var(--green)':'var(--muted)';
    var txt=val>7?'Hard 🔴':val<4?'Easy 🟢':'Moderate 🟡';
    lbl.innerHTML='<span>RPE: '+val+'/10</span><span style="color:'+col+'">'+txt+'</span>';
  }
};

window.saveDay=function(key){
  var ds=DAY_STATUS[key];
  if (!ds) { alert('Nothing to save.'); return; }
  LOGS[key]={status:ds.status,am:parseFloat(ds.am)||0,pm:parseFloat(ds.pm)||0,rpe:parseInt(ds.rpe)||5,note:ds.note||''};
  saveLogs();
  OPEN_DAYS[key]=false;
  delete DAY_STATUS[key];
  var w=PLAN[parseInt(key.split('-')[0])-1];
  var day=key.split('-')[1];
  var el=document.getElementById('dc-'+key);
  if (el) el.outerHTML=renderDayCard(w,day);
  // Update weekly total
  var wkNum=parseInt(key.split('-')[0]);
  var totalEl=document.querySelector('.wk-total');
  if (totalEl) {
    var totalAct=DAYS.reduce(function(s,d){var k=wkNum+'-'+d,l=LOGS[k];return s+(l?(l.am+l.pm):0);},0);
    var pw=PLAN[wkNum-1];
    totalEl.outerHTML='<div class="wk-total"><span style="color:var(--muted)">Logged this week</span>'
      +'<span style="font-weight:700;color:'+(totalAct>pw.total*1.15?'var(--orange)':totalAct>pw.total*0.9?'var(--green)':'var(--text)')+';font-variant-numeric:tabular-nums">'+totalAct.toFixed(1)+' / '+pw.total+' km</span></div>';
  }
};

window.openCalcLink=function(toolId){
  TAB='calc'; TOOL=toolId; render();
};

// ─── BOOT ─────────────────────────────────────────────────────────────────────
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
